worker_processes  1;
events {
    worker_connections  1024;
}
http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    # 普通请求带空 Upgrade 头时用 close，WebSocket 请求才用 upgrade
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }
    server {
        listen       80;
        server_name  _;
        # 容器内静态资源路径，对应宿主机 /root/nginx/html
        root   /usr/share/nginx/html;
        index  index.html;
        # 上传图片可能较大，放开请求体限制
        client_max_body_size 20m;

        # ---------- 后端 REST 接口 ----------
        location /api {
            proxy_pass http://45.207.214.32:8080;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        # ---------- 图片上传 + 图片静态访问 ----------
        location /upload {
            proxy_pass http://45.207.214.32:8080;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        }
        # ---------- SockJS / WebSocket ----------
        location /stomp {
            proxy_pass http://45.207.214.32:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            # SockJS 的 xhr_streaming 是长连接，必须关闭缓冲并放宽超时，否则会频繁掉线重连
            proxy_buffering    off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
        # ---------- 前端 SPA ----------
        # 路由用的是 createWebHistory，刷新子路径必须回退到 index.html
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
